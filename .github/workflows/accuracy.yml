# Butter Math accuracy checks: measurements, conversions and shopping-list math.
# Runs on every change to the site. A red X on a commit means a check failed and the change must not go live.
name: Accuracy checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Beta site checks
        run: node beta/tests/run.mjs
