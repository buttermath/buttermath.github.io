# Butter Math app checks: the beta app in a real browser with a stand-in database (beta/tests/app/app.test.mjs).
# Checks what members see on the shopping list: totals across recipes, removing and re-adding a recipe,
# one and many on one line, double clicks, code in recipes, a lost connection, and the phone screen.
# Not a publishing gate yet (added Nov 20, 2026). After a week of clean runs, add these steps to the checks job in pages.yml.
name: App checks
on:
  push:
  workflow_dispatch:
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the test browser
        run: npm install --no-save --no-package-lock playwright@1 && npx playwright install --with-deps chromium
      - name: Beta app checks
        run: node beta/tests/app/app.test.mjs
